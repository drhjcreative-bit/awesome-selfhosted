<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DU∀NYSWRLD ✳ CLAUDE OUTPUTS</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --ink: #e8e8e4;
    --dim: #8a8a84;
    --hair: #2a2a28;
    --acid: #b8ff2e;
    --red: #ff3b30;
    --merged: #a970ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 0 20px 80px;
    max-width: 1080px;
    margin: 0 auto;
  }
  a { color: inherit; }

  header { padding: 28px 0 18px; border-bottom: 1px solid var(--hair); }
  .wordmark { font-size: 28px; letter-spacing: 2px; font-weight: bold; }
  .wordmark .flip { display: inline-block; transform: scaleY(-1); }
  .wordmark .star { color: var(--acid); }
  .tagline { color: var(--dim); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; margin-top: 4px; }

  .statusline {
    display: flex; flex-wrap: wrap; gap: 18px;
    padding: 10px 0; border-bottom: 1px solid var(--hair);
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim);
  }
  .statusline b { color: var(--ink); font-weight: normal; }
  #live-dot { color: var(--acid); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--hair); }
  .chip {
    background: none; border: 1px solid var(--hair); color: var(--dim);
    font: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #search {
    background: var(--panel); border: 1px solid var(--hair); color: var(--ink);
    font: inherit; font-size: 13px; padding: 5px 10px; min-width: 220px; flex: 1;
  }
  #search:focus { outline: none; border-color: var(--acid); }

  .section-label { margin: 28px 0 12px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }

  .card {
    border: 1px solid var(--hair); background: var(--panel);
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
  .num { color: var(--dim); font-size: 12px; }
  .badge {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid; padding: 1px 7px;
  }
  .badge.merged { color: var(--merged); border-color: var(--merged); }
  .badge.open   { color: var(--acid);   border-color: var(--acid); }
  .badge.closed { color: var(--red);    border-color: var(--red); }
  .card h3 { font-size: 15px; letter-spacing: 0.5px; margin: 6px 0 4px; text-transform: uppercase; }
  .meta { color: var(--dim); font-size: 12px; word-break: break-all; }
  .desc { margin: 10px 0 12px; color: var(--ink); font-size: 13px; max-width: 78ch; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-block; text-decoration: none;
    border: 1px solid var(--ink); color: var(--ink);
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 12px;
  }
  .btn:hover { background: var(--ink); color: var(--bg); }
  .btn.primary { border-color: var(--acid); color: var(--acid); }
  .btn.primary:hover { background: var(--acid); color: var(--bg); }
  .btn.ghost { border-color: var(--hair); color: var(--dim); }
  .btn.ghost:hover { border-color: var(--ink); color: var(--ink); background: none; }

  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .projects .card { margin: 0; display: flex; flex-direction: column; }
  .projects .desc { flex: 1; }

  #empty { color: var(--dim); padding: 24px 0; display: none; }
  footer { margin-top: 48px; color: var(--dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <div class="wordmark">DU<span class="flip">A</span>NYSWRLD <span class="star">✳</span> OUTPUTS</div>
  <div class="tagline">( every claude-built output · one portal · direct downloads )</div>
</header>

<div class="statusline">
  <span>( <b id="stat-total">0</b> outputs )</span>
  <span>( <b id="stat-merged">0</b> merged )</span>
  <span>( <b id="stat-projects">0</b> projects )</span>
  <span>( <b id="stat-chat">0</b> chat outputs )</span>
  <span id="live-dot">( snapshot )</span>
</div>

<div class="controls">
  <button class="chip on" data-state="all">All</button>
  <button class="chip" data-state="merged">Merged</button>
  <button class="chip" data-state="open">Open</button>
  <button class="chip" data-state="closed">Closed</button>
  <input id="search" type="search" placeholder="( SEARCH OUTPUTS )" aria-label="Search outputs" />
</div>

<h2 class="section-label">( Standing Projects )</h2>
<div class="projects" id="projects"></div>

<h2 class="section-label">( Chat Outputs — Claude Artifacts )</h2>
<div class="projects" id="artifacts"></div>

<h2 class="section-label">( Session Outputs — Pull Requests )</h2>
<div id="list" aria-live="polite"></div>
<p id="empty">( NOTHING MATCHES )</p>

<footer>( STAY STRANGE )</footer>

<script>
"use strict";

const OWNER = "drhjcreative-bit";
const REPOS = [
  { name: "awesome-selfhosted", defaultBranch: "master" },
  { name: "awesome-go", defaultBranch: "main" },
];

// Standing projects: long-lived things Claude built that live on the default
// branch, independent of any single PR.
const PROJECTS = [
  {
    title: "DUANYSWRLD Visual Lab",
    path: "visual-lab-dupe/",
    repo: "awesome-selfhosted",
    desc: "Audio-reactive visual playground (React 19 + Vite + Web Audio). Six canvas modes incl. ORB, beat detection, mic/file input, WebM recording.",
    live: "https://drhjcreative-bit.github.io/awesome-selfhosted/",
  },
  {
    title: "Unify Remote",
    path: "unify-remote/",
    repo: "awesome-selfhosted",
    desc: "Self-hosted local-network hub: iPhone/iPad/Mac as remote, keyboard and trackpad for each other, with WebRTC screen mirroring and pairing PIN.",
    live: null,
  },
  {
    title: "Claude Outputs Portal",
    path: "claude-outputs/",
    repo: "awesome-selfhosted",
    desc: "This page. Lists every Claude-built output across the forks, refreshed live from the GitHub API, with direct ZIP / patch downloads.",
    live: null,
  },
];

// Chat outputs: artifacts published from claude.ai chat sessions. There is no
// public API to enumerate these, so this list is curated — ask Claude to
// refresh it in a future session after publishing new artifacts. The URLs are
// owner-private on claude.ai (sign-in required) unless explicitly shared.
const ARTIFACTS = [
  {
    title: "Automation Opportunities — Aug 5 Scan",
    updated: "2026-08-05",
    url: "https://claude.ai/code/artifact/8659a912-ac5d-4f90-aec8-2028ee5740e7",
    desc: "Ops-scan report ranking six manual loops worth automating across active projects (Filing Map, BGCY brand guide, resume variants, SignalOps, tarot launch, KDP pipeline), sourced from Drive + Calendar.",
  },
  {
    title: "Notice Board — Rolling Display",
    updated: "2026-07-29",
    url: "https://claude.ai/code/artifact/8551c4c5-ec29-42a3-abeb-e5e7c91c4a9c",
    desc: "School-display-style rolling notice board: drop in images, reorder and caption a message queue, then play a timed fullscreen loop with adjustable hold time.",
  },
];

// Embedded snapshot (2026-08-20) so the portal renders even when the GitHub
// API is rate-limited or unreachable. Replaced by a live fetch on load.
const SNAPSHOT = [
  { repo: "awesome-selfhosted", number: 8, title: "Add jsdom integration tests for the visual-lab-dupe App component",
    desc: "Fake-media harness (AudioContext, MediaRecorder, canvas, getUserMedia) plus 28 interaction/integration tests; App.jsx coverage ~0% → ~76%.",
    state: "merged", date: "2026-08-15", branch: "claude/test-coverage-analysis-l5b1xo",
    sha: "0e83f4539bdb1ce337d03aa6d412a2c07232fd71", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/8" },
  { repo: "awesome-selfhosted", number: 7, title: "Rebrand visual lab as DUANYSWRLD and add ORB particle-sphere mode",
    desc: "Dark editorial typewriter chrome, DU∀NYSWRLD wordmark, collapsible panel, and a 640-particle audio-reactive Fibonacci-sphere ORB mode.",
    state: "merged", date: "2026-08-08", branch: "claude/duanyswrld-vibes-update-w3wlpt",
    sha: "3917db457d8c6026131794a00b8cd288733f651d", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/7" },
  { repo: "awesome-selfhosted", number: 6, title: "Add Vitest foundation and unit tests for visual-lab-dupe helpers",
    desc: "Vitest + coverage tooling; pure logic (color, audio features, mime) extracted to src/lib with 39 tests at 100% line/branch coverage.",
    state: "merged", date: "2026-08-06", branch: "claude/test-coverage-analysis-l5b1xo",
    sha: "f79354c151df513ecc2fe04fafddcd28d5d31239", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/6" },
  { repo: "awesome-selfhosted", number: 5, title: "Add Unify Remote: cross-device remote, keyboard, trackpad + screen mirroring",
    desc: "Node WebSocket hub, Swift CGEvent bridge for native macOS control, and a dependency-free PWA client with WebRTC screen sharing.",
    state: "merged", date: "2026-08-15", branch: "claude/cross-device-remote-control-qvfjxk",
    sha: "68f5f33d4606ea1f6d9edb784dacb878616a3f5f", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/5" },
  { repo: "awesome-selfhosted", number: 4, title: "Add audio input device selector to visual lab",
    desc: "In-app input picker (specific mic or DAW loopback device) via enumerateDevices, with devicechange refresh and default-device fallback.",
    state: "merged", date: "2026-08-08", branch: "claude/todo-implementation-jgderx",
    sha: "3968d9eda27c761884d00dfafb02f41aec0c75b9", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/4" },
  { repo: "awesome-selfhosted", number: 3, title: "Add CLAUDE.md documenting repo structure and workflows",
    desc: "Orients assistants to the fork's split personality: the bot-generated list vs. the real dev target, plus commands and architecture notes.",
    state: "merged", date: "2026-08-06", branch: "claude/claude-md-documentation-b9y7l9",
    sha: "e6e717b95d5722e6596d5f67ea871b2199bc0e9e", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/3" },
  { repo: "awesome-selfhosted", number: 2, title: "Deploy Visual Lab Dupe to GitHub Pages",
    desc: "GitHub Actions Pages pipeline building visual-lab-dupe with the /awesome-selfhosted/ base path; publishes the public live URL.",
    state: "merged", date: "2026-08-15", branch: "claude/audio-reactive-visual-lab-h3qtcy",
    sha: "78ca1ef601a02056467c528431f7f75d0a1cdc07", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/2" },
  { repo: "awesome-selfhosted", number: 1, title: "Add Visual Lab Dupe: audio-reactive canvas prototype",
    desc: "The original five-mode visualizer: single-AudioContext ref architecture, mic/file switching, beat pulse, CRT/grain FX, WebM recording.",
    state: "merged", date: "2026-08-02", branch: "claude/audio-reactive-visual-lab-h3qtcy",
    sha: "d9bdcb6326c0cbaa3f08f91d22b36d0cae8e3aa1", url: "https://github.com/drhjcreative-bit/awesome-selfhosted/pull/1" },
];

let outputs = SNAPSHOT.slice();
let stateFilter = "all";
let query = "";

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

// A repo ZIP pinned to the PR's head commit — downloadable even after the
// branch is deleted, because merged commits stay reachable.
const zipUrl = (repo, sha) => `https://codeload.github.com/${OWNER}/${repo}/zip/${sha}`;

function prState(pr) {
  if (pr.merged_at) return "merged";
  return pr.state === "open" ? "open" : "closed";
}

function isClaudeOutput(pr) {
  const branch = (pr.head && pr.head.ref) || "";
  const body = pr.body || "";
  return branch.startsWith("claude/") ||
    body.includes("claude.ai/code") ||
    body.includes("Generated with [Claude Code]");
}

function summarize(body) {
  if (!body) return "";
  const line = body
    .split("\n")
    .map((l) => l.trim())
    .find((l) => l && !l.startsWith("#") && !l.startsWith("---") && !l.startsWith("!["));
  if (!line) return "";
  const plain = line
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[*_`]/g, "");
  return plain.length > 180 ? plain.slice(0, 177) + "…" : plain;
}

function render() {
  const q = query.toLowerCase();
  const shown = outputs.filter((o) =>
    (stateFilter === "all" || o.state === stateFilter) &&
    (!q || (o.title + " " + o.desc + " " + o.branch + " " + o.repo).toLowerCase().includes(q)),
  );

  document.getElementById("stat-total").textContent = outputs.length;
  document.getElementById("stat-merged").textContent = outputs.filter((o) => o.state === "merged").length;
  document.getElementById("stat-projects").textContent = PROJECTS.length;
  document.getElementById("stat-chat").textContent = ARTIFACTS.length;

  document.getElementById("list").innerHTML = shown.map((o) => `
    <article class="card">
      <div class="card-top">
        <span class="num">${esc(o.repo)} · PR #${o.number}</span>
        <span class="badge ${o.state}">${o.state}</span>
        <span class="num">${esc(o.date)}</span>
      </div>
      <h3>${esc(o.title)}</h3>
      <div class="meta">${esc(o.branch)} @ ${esc(o.sha.slice(0, 7))}</div>
      ${o.desc ? `<p class="desc">${esc(o.desc)}</p>` : ""}
      <div class="btns">
        <a class="btn primary" href="${zipUrl(o.repo, o.sha)}">⬇ Download ZIP</a>
        <a class="btn ghost" href="${esc(o.url)}.patch">Patch</a>
        <a class="btn ghost" href="${esc(o.url)}.diff">Diff</a>
        <a class="btn ghost" href="${esc(o.url)}" target="_blank" rel="noopener">Open PR ↗</a>
      </div>
    </article>`).join("");

  document.getElementById("empty").style.display = shown.length ? "none" : "block";
}

function renderProjects() {
  document.getElementById("projects").innerHTML = PROJECTS.map((p) => {
    const repo = REPOS.find((r) => r.name === p.repo);
    const zip = `https://codeload.github.com/${OWNER}/${p.repo}/zip/refs/heads/${repo.defaultBranch}`;
    const tree = `https://github.com/${OWNER}/${p.repo}/tree/${repo.defaultBranch}/${p.path}`;
    return `
    <article class="card">
      <div class="card-top"><span class="num">${esc(p.repo)}/${esc(p.path)}</span></div>
      <h3>${esc(p.title)}</h3>
      <p class="desc">${esc(p.desc)}</p>
      <div class="btns">
        <a class="btn primary" href="${zip}">⬇ Repo ZIP</a>
        <a class="btn ghost" href="${tree}" target="_blank" rel="noopener">Browse ↗</a>
        ${p.live ? `<a class="btn" href="${esc(p.live)}" target="_blank" rel="noopener">Live ↗</a>` : ""}
      </div>
    </article>`;
  }).join("");
}

function renderArtifacts() {
  document.getElementById("artifacts").innerHTML = ARTIFACTS.map((a) => `
    <article class="card">
      <div class="card-top">
        <span class="num">claude.ai artifact</span>
        <span class="num">${esc(a.updated)}</span>
      </div>
      <h3>${esc(a.title)}</h3>
      <p class="desc">${esc(a.desc)}</p>
      <div class="btns">
        <a class="btn primary" href="${esc(a.url)}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </article>`).join("");
}

async function refreshLive() {
  try {
    const lists = await Promise.all(REPOS.map(async (r) => {
      const res = await fetch(
        `https://api.github.com/repos/${OWNER}/${r.name}/pulls?state=all&per_page=100`,
        { headers: { Accept: "application/vnd.github+json" } },
      );
      if (!res.ok) throw new Error(`${r.name}: HTTP ${res.status}`);
      const prs = await res.json();
      return prs.filter(isClaudeOutput).map((pr) => ({
        repo: r.name,
        number: pr.number,
        title: pr.title,
        desc: summarize(pr.body),
        state: prState(pr),
        date: (pr.merged_at || pr.closed_at || pr.created_at || "").slice(0, 10),
        branch: pr.head.ref,
        sha: pr.head.sha,
        url: pr.html_url,
      }));
    }));
    outputs = lists.flat().sort((a, b) => (a.date < b.date ? 1 : -1));
    document.getElementById("live-dot").textContent = "( live · github api )";
    render();
  } catch (err) {
    document.getElementById("live-dot").textContent = "( snapshot · api unavailable )";
    console.warn("Live refresh failed, showing embedded snapshot:", err);
  }
}

document.querySelectorAll(".chip[data-state]").forEach((chip) => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip[data-state]").forEach((c) => c.classList.remove("on"));
    chip.classList.add("on");
    stateFilter = chip.dataset.state;
    render();
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

renderProjects();
renderArtifacts();
render();
refreshLive();
</script>
</body>
</html>
