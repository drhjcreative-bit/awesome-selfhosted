name: Deploy Visual Lab Dupe to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "visual-lab-dupe/**"
      - ".github/workflows/deploy-visual-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-lab-dupe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-lab-dupe/package-lock.json
      - run: npm ci
      # Served from https://<owner>.github.io/awesome-selfhosted/, so assets
      # must resolve under that sub-path.
      - run: npm run build
        env:
          VITE_BASE: /awesome-selfhosted/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: visual-lab-dupe/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
